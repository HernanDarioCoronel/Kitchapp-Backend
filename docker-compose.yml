services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ENV_POSTGRES_USER
      POSTGRES_PASSWORD: ENV_POSTGRES_PASSW
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-config/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d spring"]
      interval: 10s
      timeout: 10s
      retries: 3

volumes:
  postgres_data: