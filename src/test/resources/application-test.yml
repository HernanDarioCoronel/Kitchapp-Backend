spring:
  config:
    import: ""
  datasource:
    url: jdbc:postgresql://localhost:5432/kitchapp_test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    execute-in-transaction: false
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: false
        jdbc:
          time_zone: UTC

app:
  security:
    jwt:
      secret: test-integration-secret-key-long-enough-for-hmac-sha256-algorithm-kitchapp
      access-token-expiration-minutes: 60
      refresh-token-expiration-days: 7
  storage:
    location: /tmp/kitchapp-test-storage
    base-url: http://localhost:8080

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    org.flywaydb: INFO
