spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: KitchApp
  datasource:
    url: jdbc:postgresql://localhost:5432/${ENV_DATABASE_NAME}
    username: ${ENV_POSTGRES_USER}
    password: ${ENV_POSTGRES_PASSW}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 2000
  flyway:
    enabled: true
    execute-in-transaction: false # habilita las transacciones manuales
    baseline-on-migrate: true # usar flyway como punto de partida, deshabilitar si ya existe la db
    validate-on-migrate: true
    locations: classpath:db/migration # ubicacion de las migraciones
  jpa:
    hibernate:
      ddl-auto: validate # para evitar que se actualice automaticamente las migraciones a la base de datos usamos validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: false
        jdbc:
          time_zone: UTC
